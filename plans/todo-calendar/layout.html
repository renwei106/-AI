<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>待办布局预览 · 日 / 周 / 月</title>
<style>
@font-face{font-family:Youfeng;src:url('../../dist/assets/fonts/shiyu-youfeng/ShiyuYoufeng-Preview-Regular.woff2') format('woff2');font-display:swap}
/* Standalone planning preview. This accent is sampled from the current base theme;
   production integration must inherit resolveThemeColor() / --accent. */
:root{--accent:#48614c;--ink:#303a32;--muted:#828980;--line:#e7ebe5;--paper:#fff;--soft:#f4f6f2;--red:#b55653;--amber:#99731e;--blue:#527b9a;--font:Youfeng,'Microsoft YaHei',sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:#f8f9f7;color:var(--ink);font:15px var(--font)}button,input,textarea{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer}button:hover{background:var(--soft)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{cursor:default}button:disabled:hover{background:transparent}input{min-width:0}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.ico{width:32px;height:32px;border-radius:7px;display:inline-grid;place-items:center}.shell{height:calc(100dvh - 44px);margin:16px 20px 0;display:grid;grid-template-rows:52px minmax(0,1fr);background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px #e9ede6}.toolbar{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}.toolbar .date{font-size:18px;margin-left:9px;white-space:nowrap}.toolbar .spacer{flex:1}.today{padding:6px 12px;border-radius:6px;background:var(--soft)}.switch{display:flex;background:var(--soft);padding:3px;border-radius:8px;gap:2px}.switch button{padding:5px 15px;border-radius:6px;color:var(--muted)}.switch button[aria-pressed=true]{background:#fff;color:var(--accent);box-shadow:0 1px 4px #142e1810}.primary{background:var(--accent);color:#fff;border-radius:7px;padding:7px 13px}.primary:hover{background:color-mix(in srgb,var(--accent),#000 10%)}.body{display:flex;min-height:0}.sidebar{width:250px;flex-shrink:0;background:#fafbf9;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 15px 15px;gap:18px;overflow:auto}.quick{background:#fff;border:1px solid var(--line);padding:10px 9px;color:var(--muted);border-radius:8px;display:flex;align-items:center;gap:7px;font-size:14px;text-align:left}.section-title{display:flex;gap:6px;align-items:center;font-size:16px;margin:2px 6px 11px}.count{font:12px 'Microsoft YaHei',sans-serif;color:var(--muted);margin-left:auto}.subtitle{margin:0 6px 12px;font-size:12px;color:var(--muted)}.inbox-item{width:100%;text-align:left;display:flex;align-items:flex-start;padding:12px 9px;gap:8px;background:#fff;margin-bottom:8px;border-radius:8px;box-shadow:0 1px 3px #1e321004}.circle{height:15px;width:15px;border:1.3px solid #aeb8aa;border-radius:50%;display:inline-block;flex-shrink:0;margin-top:3px}.inbox-item strong{font-size:14px;font-weight:normal}.inbox-item small{display:block;margin-top:7px;font-size:12px;color:var(--muted)}.tag{font-size:10px;padding:1px 5px;border-radius:4px;background:#f0f2ed;color:#90978a;white-space:nowrap}.group{width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;text-align:left;margin:2px 0;font-size:14px}.group.active{background:#e9eee7;color:var(--accent)}.group small{margin-left:auto;color:var(--muted)}.dot{height:6px;width:6px;border-radius:50%;background:#929f8c;display:inline-block;margin:0 6px}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.sidebar-bottom .group{padding:7px 11px;color:#788170}.hint{margin-top:8px;padding:13px 12px;border-radius:8px;background:#edf2e9;font-size:12px;line-height:1.7;color:#6b7b62}.hint b{font-weight:normal;display:block;color:var(--accent);margin-bottom:3px}.hint button{padding:0;text-decoration:underline;margin-top:5px;color:var(--accent)}.calendar{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.weekhead,.all-day{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));flex-shrink:0}.weekhead{height:64px;border-bottom:1px solid var(--line)}.dayhead{display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.dayhead strong{font-size:22px;color:#53604e;font-weight:normal}.dayhead.is-today strong{background:var(--accent);border-radius:50%;width:33px;height:33px;display:grid;place-items:center;color:#fff}.all-day{min-height:42px;border-bottom:1px solid var(--line);align-items:center}.all-day .label{font-size:11px;text-align:center;color:var(--muted)}.all-cell{border-left:1px solid var(--line);min-height:42px;display:flex;align-items:center;padding:4px}.all-event{background:#edf2e9;border-radius:4px;font-size:12px;padding:5px 7px;color:#69805d;width:100%;text-align:left}.scroll{flex:1;overflow:auto;min-height:0}.timegrid{height:1440px;position:relative;display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr))}.hours{position:relative;color:#949c90;font:11px 'Microsoft YaHei',sans-serif}.hour{height:60px;text-align:center;padding-top:1px;position:relative;top:-7px}.column{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,#f0f2ee 29px,#f0f2ee 30px,transparent 30px,transparent 59px,var(--line) 59px,var(--line) 60px)}.column.today-column{background-color:#f9fbf7}.event{position:absolute;left:5px;right:5px;border-radius:6px;padding:8px 9px;text-align:left;color:#526249;border-left:3px solid #8ea17f;background:#edf2e8;overflow:hidden;font-size:14px}.event small{display:block;font:10px 'Microsoft YaHei',sans-serif;margin-top:6px;opacity:.74}.event b{font-weight:normal;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event .event-meta{font-family:var(--font);margin-top:8px;font-size:11px}.event.compact{padding:3px 7px;font-size:12px}.event.compact b{line-height:13px}.event.compact small{font-size:9px;line-height:9px;margin-top:1px}.event.compact.selected:after{bottom:0;height:2px}.event.blue{background:#eaf1f6;border-left-color:#86a8c0;color:#4f7189}.event.amber{background:#f6f0df;border-left-color:#c6ac66;color:#8d7433}.event.red{background:#f6e9e6;border-left-color:#c8887a;color:#ac6659}.event.gray{background:#f0f1ee;border-left-color:#b0b8a8;color:#7e8975}.event.selected{box-shadow:0 0 0 1.5px #b8a376}.event.selected:after{content:'';position:absolute;bottom:4px;left:calc(50% - 10px);height:3px;width:20px;border-radius:3px;background:#ba9d54}.now{position:absolute;top:690px;left:56px;right:0;border-top:1px solid #bac8b0;z-index:2;pointer-events:none}.now:before{content:'';position:absolute;left:-3px;top:-3px;width:5px;height:5px;background:#839a72;border-radius:50%}.drawer{width:338px;flex-shrink:0;border-left:1px solid var(--line);background:#fff;padding:17px 20px;display:flex;flex-direction:column;gap:17px;overflow:auto}.drawer[hidden]{display:none}.drawer-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.drawer h2{margin:4px 0 0;font-size:22px;font-weight:normal;line-height:1.5}.drawer p{color:#7b8575;font-size:14px;line-height:1.9;margin:0}.field{padding:13px 0;border-bottom:1px solid #f0f2ed;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}.field span{color:var(--muted)}.field strong{font-weight:normal}.desc{background:#f8faf5;padding:14px!important;border-radius:8px}.drawer-foot{margin-top:auto;display:flex;gap:8px;padding-top:22px;align-items:center}.drawer-foot .delete{color:#aa7770;margin-right:auto}.drawer-foot button{padding:7px 11px;border-radius:6px}.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:34px repeat(5,minmax(110px,1fr));height:100%;min-height:0;overflow:auto}.month-label{font-size:12px;color:var(--muted);text-align:center;padding:10px}.month-cell{border-right:1px solid var(--line);border-top:1px solid var(--line);padding:9px 7px;min-width:0}.month-cell .number{font:12px 'Microsoft YaHei',sans-serif;margin:0 0 9px 4px;color:#7f8b77;display:block}.month-cell.outside{background:#fafbf9}.month-cell.outside .number{color:#bac1b5}.month-cell.is-today{background:#f5f8f0}.month-cell.is-today .number{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;margin-top:-4px;margin-bottom:5px}.month-task{font-size:12px;text-align:left;padding:5px 6px;background:#edf2e8;border-radius:4px;display:block;width:100%;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#69825a}.month-task.amber{background:#f6f0df;color:#987e39}.month-task.blue{background:#eaf1f6;color:#547b98}.preview-note{height:28px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#939b8c;padding:0 25px}.day .weekhead,.day .all-day,.day .timegrid{grid-template-columns:56px minmax(0,1fr)}.day .event{max-width:540px}.timeline-mini{height:390px;position:relative;border-left:1px solid var(--line);margin:5px 0 0 37px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 63px,var(--line) 63px,var(--line) 64px)}.mini-hour{height:64px;position:relative}.mini-hour span{position:absolute;left:-40px;top:-6px;font:10px sans-serif;color:#9aa190}.mini-event{top:64px;height:64px;left:8px;right:0}.dialog{border:1px solid var(--line);border-radius:14px;max-width:430px;padding:24px;color:var(--ink);background:#fff}.dialog::backdrop{background:#17221338}.dialog p{font-size:14px;line-height:1.9;color:#77816f}.dialog h3{font-size:20px;font-weight:normal;margin:0}.dialog .primary{float:right}.mobile-note{display:none}
@media(max-width:1100px){.sidebar{width:224px}.drawer{position:absolute;right:20px;top:68px;bottom:28px;z-index:5;box-shadow:-8px 0 24px #2333210c}.toolbar .date{font-size:15px}.event{font-size:12px;padding:7px 5px}}
@media(max-width:680px){.shell{margin:8px 8px 0;height:calc(100dvh - 40px)}.sidebar{position:absolute;top:96px;left:8px;bottom:32px;z-index:5;width:246px;box-shadow:5px 0 20px #14251516}.sidebar[hidden]{display:none}.toolbar{flex-wrap:wrap;gap:4px;padding:5px 9px;align-content:center}.shell{grid-template-rows:88px minmax(0,1fr)}.toolbar .date{font-size:14px}.toolbar .spacer{display:none}.toolbar .switch{margin-left:auto}.toolbar .switch button{padding:4px 10px}.toolbar .new{font-size:12px}.drawer{top:96px;right:8px;left:8px;bottom:32px;width:auto}.calendar:not(.day) .weekhead,.calendar:not(.day) .all-day,.calendar:not(.day) .timegrid{min-width:730px}.calendar{overflow:auto}.calendar .scroll{overflow:visible}.calendar.day .scroll{overflow:auto}.month{min-width:520px}.preview-note{font-size:9px;padding:0 10px}.preview-note span:last-child{display:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="toolbar">
    <button class="ico" id="toggleSidebar" aria-label="收起或展开收集箱" title="收集箱"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <button class="ico" id="prev" aria-label="上一周期">‹</button><button class="today" id="today">今天</button><button class="ico" id="next" aria-label="下一周期">›</button>
    <button class="date" id="dateLabel" title="正式功能中可选择任意日期"></button><span class="spacer"></span>
    <div class="switch" aria-label="日历视图"><button data-view="day" aria-pressed="false">日</button><button data-view="week" aria-pressed="true">周</button><button data-view="month" aria-pressed="false">月</button></div>
    <button class="ico" data-help="搜索" aria-label="搜索事项"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button>
    <button class="primary new" data-help="新建事项">＋ 新建</button><button class="ico" data-help="更多" aria-label="更多操作">···</button>
  </header>
  <div class="body">
    <aside class="sidebar" id="sidebar">
      <button class="quick" data-help="快速添加">＋ 随手记一件事 <span style="margin-left:auto;font:10px sans-serif">↵</span></button>
      <section><div class="section-title">收集箱 <span class="count">2</span></div><p class="subtitle">还没安排时间，先收在这里</p>
        <button class="inbox-item" data-task="read"><span class="circle"></span><span><strong>读一章喜欢的书</strong><small>学习 · 预计 30 分钟 <span class="tag">示例</span></small></span></button>
        <button class="inbox-item" data-task="try"><span class="circle"></span><span><strong>试着完成这件小事</strong><small>点左侧圆圈，完成后可以找回 <span class="tag">示例</span></small></span></button>
      </section>
      <section><div class="section-title">分组 <button class="ico" data-help="分组" style="margin-left:auto" aria-label="新建分组">＋</button></div>
        <button class="group active" data-help="分组"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>全部分组<small>5</small></button>
        <button class="group" data-help="分组"><span class="dot"></span>工作<small>1</small></button><button class="group" data-help="分组"><span class="dot"></span>生活<small>2</small></button><button class="group" data-help="分组"><span class="dot"></span>学习<small>1</small></button><button class="group" data-help="分组"><span class="dot"></span>未分组<small>1</small></button>
      </section>
      <div class="sidebar-bottom"><button class="group" data-help="逾期">◷　逾期</button><button class="group" data-help="已完成">✓　已完成</button><button class="group" data-help="最近删除">♧　最近删除</button>
        <div class="hint"><b>把想做的事，放进一天里</b>拖进日历安排时间，拖动边缘调整时长。<br><button data-help="示例引导">试一试</button><span style="float:right"><button data-help="清除示例">清除示例</button></span></div>
      </div>
    </aside>
    <main class="calendar" id="calendar" aria-label="待办日历布局"></main>
    <aside class="drawer" id="drawer" hidden aria-label="事项详情布局"></aside>
  </div>
</div>
<div class="preview-note"><span>布局预览 · 保留现有入口、主题与字体 · 可切换日 / 周 / 月，点击事项查看详情</span><span>示意数据 · 创建、拖拽、保存等业务功能尚未实现</span></div>
<dialog class="dialog" id="info"><h3 id="infoTitle"></h3><p id="infoText"></p><form method="dialog"><button class="primary">知道了</button></form></dialog>
<script>
const $=s=>document.querySelector(s);let mode='week',shift=0;const demoToday=new Date(2026,8,29);let selectedTask='plan';
const tasks={plan:{title:'整理本周要做的事',description:'先选出本周最重要的三件事，再给它们安排合适的时间。\n\n试一试：拖动事项底边，把 30 分钟延长到 45 分钟。',time:'09:00 — 09:30',group:'工作',priority:'中优先级',color:'#99731e'},walk:{title:'出门散步',description:'给自己留一点轻松的时间。点击时间字段，也可以精确修改安排。',time:'18:30 — 19:00',group:'生活',priority:'低优先级',color:'#527b9a'},fruit:{title:'买水果',description:'只需要今天完成，不必安排具体小时。可以拖到其他日期，也可以再补上时刻。',time:'未指定时间',group:'生活',priority:'无优先级',color:'#828980'},read:{title:'读一章喜欢的书',description:'先放进收集箱，等有空时再拖进日历。\n\n预计阅读 30 分钟，拖到任意空闲时段即可。',time:'未安排 · 预计 30 分钟',group:'学习',priority:'无优先级',color:'#828980'},try:{title:'试着完成这件小事',description:'正式功能里，点事项左侧圆圈完成。完成后去“已完成”找回，也可以立即撤销。',time:'未安排',group:'未分组',priority:'无优先级',color:'#828980'}};
const guide={'搜索':'正式功能：搜索任务名称和描述，支持未完成/已完成筛选；结果可打开详情、定位日期。','新建事项':'正式功能：名称必填，描述、时间、分组和优先级选填；保存后出现在对应列表与日历。','快速添加':'正式功能：输入名称按 Enter 添加到收集箱，连续输入可连续记事，不强迫先填日期。','更多':'正式功能：显示已完成、示例与帮助、最近删除和少量显示选项。重复与提醒在完整实现后再开放。','分组':'正式功能：点击筛选分组，拖到分组只改变归类、保留日期。可新建、改名、排序和删除，删除分组时保留任务。','逾期':'正式功能：查看已经过期但未完成的真实任务，可完成、重新安排或取消排期。示例不计入逾期数量。','已完成':'正式功能：查看完成记录，可恢复到原分组和原日期。','最近删除':'正式功能：保留 30 天，可恢复或永久删除；永久删除需确认。','示例引导':'正式功能：拖入日历 → 拉伸时长 → 勾选完成。三步随时可跳过，帮助中可重新查看。此文件仅用于布局评审。','清除示例':'正式功能：仅清除仍标记为示例的任务，支持撤销；自己的任务与主动保留的示例不受影响，刷新不重新生成。','保存':'这是布局演示，未修改任何真实任务。正式功能保存成功后各视图同步，失败保留草稿并提供重试。','删除':'正式功能：移入最近删除并支持撤销，不直接永久删除。','日期跳转':'正式功能：打开日期选择器，选择任意日期跳到对应日、周或月。此布局演示可以使用两侧箭头查看其他周期。'};
function openInfo(key){$('#infoTitle').textContent=key;$('#infoText').textContent=guide[key]||guide['保存'];$('#info').showModal()}
function period(){const d=new Date(demoToday);if(mode==='month'){d.setDate(1);d.setMonth(d.getMonth()+shift)}else d.setDate(d.getDate()+shift*(mode==='week'?7:1));return d}
function key(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function card(id,top,height,style=''){const t=tasks[id];return `<button class="event ${style} ${height<=40?'compact':''}" data-task="${id}" style="top:${top}px;height:${height}px" title="点击查看事项详情"><b>○ ${t.title}</b><small>${t.time}</small>${height>65?'<small class="event-meta">'+t.group+' · 示例</small>':''}</button>`}
function timeline(){const p=period();if(mode==='week')p.setDate(p.getDate()-((p.getDay()+6)%7));const days=Array.from({length:mode==='day'?1:7},(_,i)=>{const d=new Date(p);d.setDate(d.getDate()+i);return d});$('#dateLabel').textContent=mode==='day'?`${p.getMonth()+1}月${p.getDate()}日`:`${days[0].getMonth()+1}月${days[0].getDate()}日 — ${days.at(-1).getMonth()+1}月${days.at(-1).getDate()}日`;
 let html='<div class="weekhead"><div></div>'+days.map(d=>`<div class="dayhead ${key(d)===key(demoToday)?'is-today':''}"><span>周${'日一二三四五六'[d.getDay()]}</span><strong>${d.getDate()}</strong></div>`).join('')+'</div><div class="all-day"><div class="label">全天</div>'+days.map(d=>`<div class="all-cell">${key(d)==='2026-9-30'?'<button class="all-event" data-task="fruit">○ 买水果 <span class="tag">示例</span></button>':''}</div>`).join('')+'</div><div class="scroll"><div class="timegrid"><div class="hours">'+Array.from({length:24},(_,i)=>`<div class="hour">${String(i).padStart(2,'0')}:00</div>`).join('')+'</div>';
 html+=days.map(d=>`<div class="column ${key(d)===key(demoToday)?'today-column':''}">${key(d)===key(demoToday)?card('plan',540,30,'amber selected')+card('walk',1110,30,'blue'):''}</div>`).join('');if(shift===0)html+='<div class="now"></div>';html+='</div></div>';return html}
function month(){const p=period();$('#dateLabel').textContent=`${p.getFullYear()}年 ${p.getMonth()+1}月`;const first=new Date(p.getFullYear(),p.getMonth(),1);first.setDate(first.getDate()-((first.getDay()+6)%7));const rows=Math.ceil((((new Date(p.getFullYear(),p.getMonth(),1).getDay()+6)%7)+new Date(p.getFullYear(),p.getMonth()+1,0).getDate())/7);const days=Array.from({length:rows*7},(_,i)=>{const d=new Date(first);d.setDate(d.getDate()+i);return d});return '<div class="month" style="grid-template-rows:34px repeat('+rows+',minmax(110px,1fr))">'+[...'一二三四五六日'].map(n=>'<div class="month-label">周'+n+'</div>').join('')+days.map(d=>`<div class="month-cell ${d.getMonth()!==p.getMonth()?'outside':''} ${key(d)===key(demoToday)?'is-today':''}"><span class="number">${d.getDate()}</span>${key(d)===key(demoToday)?'<button class="month-task amber" data-task="plan">09:00 整理本周要做的事</button><button class="month-task blue" data-task="walk">18:30 出门散步</button>':key(d)==='2026-9-30'?'<button class="month-task" data-task="fruit">○ 买水果</button>':''}</div>`).join('')+'</div>'}
function render(){const c=$('#calendar');c.className='calendar '+(mode==='day'?'day':'');c.innerHTML=mode==='month'?month():timeline();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===mode)));$('#drawer').hidden=true;const scroller=c.querySelector('.scroll');if(scroller)scroller.scrollTop=420}
function detail(id){selectedTask=id;const t=tasks[id];const d=$('#drawer');d.hidden=false;d.innerHTML=`<div class="drawer-top"><span>事项详情 <span class="tag">示例</span></span><button class="ico" id="closeDrawer" aria-label="关闭详情">×</button></div><h2><span class="circle" style="vertical-align:middle;margin:0 8px 3px 0"></span>${t.title}</h2><p class="desc">${t.description.replaceAll('\n','<br>')}</p><div><div class="field"><span>日期</span><strong>${id==='read'||id==='try'?'未安排':id==='fruit'?'9 月 30 日 · 周三':'9 月 29 日 · 周二'}</strong></div><div class="field"><span>时间</span><strong>${t.time}</strong></div><div class="field"><span>分组</span><strong>${t.group}　⌄</strong></div><div class="field"><span>优先级</span><strong style="color:${t.color}">⚑ ${t.priority}　⌄</strong></div></div>${mode==='month'&&id!=='read'&&id!=='try'?'<button class="quick" id="showDay" style="justify-content:center">展开当天时间轴，调整时长 ↗</button>':''}<p style="font-size:12px;margin-top:4px">点勾选框完成，点名称编辑。<br>所有字段在正式功能中可修改。</p><div class="drawer-foot"><button class="delete" data-help="删除">删除</button><button id="cancelDrawer">取消</button><button class="primary" data-help="保存">保存</button></div>`}
function showDay(){const d=$('#drawer');d.innerHTML='<div class="drawer-top"><span>9 月 29 日 · 调整时段</span><button class="ico" id="closeDrawer" aria-label="关闭时间轴">×</button></div><p>上下拖动事项边缘调整时长。<br>关闭后仍停留在当前月视图。</p><div class="timeline-mini">'+[8,9,10,11,12,13].map(h=>'<div class="mini-hour"><span>'+h+':00</span></div>').join('')+'<button class="event amber selected mini-event" data-task="plan"><b>整理本周要做的事</b><small>09:00 — 10:00 · 拉伸示意</small></button></div><div class="drawer-foot"><button class="primary" id="closeDrawer">完成调整</button></div>'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){mode=b.dataset.view;shift=0;render()}else if(b.dataset.task)detail(b.dataset.task);else if(b.dataset.help)openInfo(b.dataset.help);else if(b.id==='closeDrawer'||b.id==='cancelDrawer')$('#drawer').hidden=true;else if(b.id==='showDay')showDay();else if(b.id==='toggleSidebar'){$('#sidebar').hidden=!$('#sidebar').hidden;$('#sidebar').style.display=$('#sidebar').hidden?'none':''}else if(b.id==='prev'||b.id==='next'){shift+=b.id==='next'?1:-1;render()}else if(b.id==='today'){shift=0;render()}else if(b.id==='dateLabel')openInfo('日期跳转')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#drawer').hidden=true});if(innerWidth<681){mode='day';$('#sidebar').hidden=true;$('#sidebar').style.display='none'}render();
</script>
</body>
</html>
