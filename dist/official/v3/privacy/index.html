    <h1 data-legal-title>隐私政策</h1>

    <div class="legal-body" data-legal-body><p class="legal-loading">正在加载隐私政策…</p></div>

  </footer>
  <script>
  (async () => {
    'use strict';
    const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const key = document.body.dataset.legalKey;
    const titleEl = document.querySelector('[data-legal-title]');
    const metaEl = document.querySelector('[data-legal-meta]');
    const bodyEl = document.querySelector('[data-legal-body]');
    const fail = message => { if (bodyEl) bodyEl.innerHTML = '<p class="doc-note">' + esc(message) + '</p>'; };
    try {
      const response = await fetch('/api/shiyu/agreements', { credentials: 'same-origin', cache: 'no-store' });
      const result = await response.json();
      if (!response.ok) throw new Error(result.message || '隐私政策暂时无法加载');
      const list = result.agreements || [];
      const item = list.find(x => x.key === key) || list[0];
      if (!item) throw new Error('隐私政策暂时无法加载');
      if (titleEl) titleEl.textContent = item.title;
      document.title = item.title + ' - 拾隅';
      if (metaEl) {
        const bits = [];
        if (item.version) bits.push('版本 ' + item.version);
        if (item.updatedAt) bits.push('更新于 ' + String(item.updatedAt).slice(0, 10));
        metaEl.textContent = bits.join(' · ');
      }
      if (bodyEl) bodyEl.innerHTML = item.format === 'html' ? item.body : '<p>' + esc(item.body).replace(/\n/g, '</p><p>') + '</p>';
    } catch (error) {
      fail(error.message || '隐私政策暂时无法加载，请稍后重试。');
    }
  })();
  </script>
</body>
