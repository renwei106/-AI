<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一隅 · 你的互联网，自成一隅</title><meta name="description" content="一隅，安放你的网址与灵感。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%233e5547'/%3E%3Cpath d='M11 28V12h18M20 20h9v8h-9z' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<header><button class="brand" data-action="home" aria-label="返回首页"><span class="brand-mark">◩</span> 一隅<span class="brand-en">YIYU</span></button><div class="header-right"><span class="prototype">交互原型</span><button class="icon-button" data-action="settings" aria-label="主题风格设置">◐</button><button class="account" data-action="login">登录</button></div></header>
<main id="main"></main><div id="dock"></div><div id="toast" role="status"></div>
<dialog id="settings"><div class="dialog-heading"><div><span class="eyebrow">MAKE IT YOURS</span><h2>让这里，更像你。</h2></div><button class="icon-button" data-action="close" aria-label="关闭外观设置">×</button></div><div id="settings-body"></div></dialog>
<dialog id="add"><div class="dialog-heading"><div><span class="eyebrow">A NEW DISCOVERY</span><h2>收下一点新发现</h2></div><button class="icon-button" data-action="close" aria-label="关闭新增收藏">×</button></div><form id="add-form"><label>网址<input name="url" type="url" required placeholder="https://" autocomplete="url"></label><label>名称<input name="title" required placeholder="给这个收藏起个名字" maxlength="100"></label><label>保存到<select name="destination" id="destination"></select></label><p class="form-note">未登录时，保存会进入登录流程，并保留已填内容。</p><button class="primary full" type="submit">保存收藏 ↗</button></form></dialog>
<dialog id="login"><div class="dialog-heading"><div><span class="eyebrow">YOUR OWN LITTLE CORNER</span><h2>把喜欢的，留在这里。</h2></div><button class="icon-button" data-action="close" aria-label="关闭登录">×</button></div><p class="login-description">正式版登录后，收藏与个性设置将保存在你的账号下，随时回来，接着探索。</p><div class="demo-note">当前为交互原型，不收集手机号或密码。体验内容仅保存在本机浏览器，不代表真实账号或云端同步。</div><button class="primary full" data-action="demo-login">体验登录并继续 →</button></dialog>
<script src="app.js"></script></body></html>
