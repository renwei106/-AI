<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liquid Orbit Menu</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-0: #05070d;
      --bg-1: #0b1020;
      --ink: #f4f8ff;
      --muted: #8993ae;
      --blue: #62b7ff;
      --cyan: #75f1e1;
      --violet: #8d7dff;
      --orbit-size: min(84vw, 690px);
      --item-size: clamp(68px, 11vw, 94px);
      --ring-width: 88%;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 44%, rgba(44, 82, 154, .22), transparent 34%),
        radial-gradient(circle at 22% 18%, rgba(89, 128, 255, .1), transparent 28%),
        linear-gradient(145deg, var(--bg-1), var(--bg-0) 64%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -30%;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle, #000 0 22%, transparent 72%);
      opacity: .16;
      transform: rotate(14deg);
    }

    body::after {
      background-image: radial-gradient(circle at center, rgba(255,255,255,.18) 0 1px, transparent 1.5px);
      background-size: 48px 48px;
      opacity: .18;
      transform: rotate(-18deg) scale(1.3);
    }

    .stage {
      position: relative;
      width: var(--orbit-size);
      aspect-ratio: 1;
      isolation: isolate;
      user-select: none;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 6%;
      border: 1px solid rgba(155, 185, 255, .1);
      border-radius: 50%;
      box-shadow: 0 0 80px rgba(73, 135, 255, .08), inset 0 0 60px rgba(87, 129, 255, .04);
      pointer-events: none;
    }

    .stage::after {
      content: "SCROLL TO ROTATE";
      position: absolute;
      left: 50%;
      bottom: -3.2rem;
      transform: translateX(-50%);
      color: rgba(204, 220, 255, .45);
      font-size: 10px;
      letter-spacing: .22em;
      white-space: nowrap;
    }

    .orbit-track,
    .orbit-track::before,
    .orbit-track::after {
      position: absolute;
      inset: 16%;
      border: 1px solid rgba(138, 174, 255, .14);
      border-radius: 50%;
      pointer-events: none;
    }

    .orbit-track::before,
    .orbit-track::after {
      content: "";
      inset: 11%;
      border-color: rgba(110, 246, 220, .12);
      transform: rotate(24deg) scaleX(.88);
    }

    .orbit-track::after {
      inset: 23%;
      border-style: dashed;
      border-color: rgba(160, 142, 255, .16);
      transform: rotate(-28deg) scaleY(.86);
    }

    .menu-shell {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(.78);
      transition: opacity .42s ease, transform .72s cubic-bezier(.2, .8, .2, 1);
      transition-delay: 0s;
      pointer-events: none;
    }

    .is-hover .menu-shell {
      opacity: 1;
      transform: scale(1);
      transition-delay: 1s;
      pointer-events: auto;
    }

    .orbit {
      position: absolute;
      cursor: pointer;
      inset: 0;
      transform: rotate(var(--rotation, 0deg));
      transition: transform .32s cubic-bezier(.2, .8, .2, 1);
      will-change: transform;
    }

    .orbit::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--ring-width);
      height: var(--ring-width);
      transform: translate(-50%, -50%);
      border: 1px solid rgba(133, 187, 255, .22);
      border-radius: 50%;
      box-shadow: 0 0 34px rgba(69, 148, 255, .08), inset 0 0 22px rgba(81, 193, 255, .05);
    }

    .orbit::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--ring-width) - 22px);
      height: calc(var(--ring-width) - 22px);
      transform: translate(-50%, -50%);
      border: 1px dashed rgba(139, 128, 255, .26);
      border-radius: 50%;
      opacity: .8;
    }

    .menu-item {
      --angle: 0deg;
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--ring-width);
      height: var(--ring-width);
      display: block;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: rgba(231, 240, 255, .74);
      background: conic-gradient(from -28deg, rgba(25, 53, 91, .95) 0 56deg, transparent 56deg 360deg);
      -webkit-mask: radial-gradient(circle at center, transparent 0 31%, #000 31.5% 100%), conic-gradient(from -28deg, #000 0 56deg, transparent 56deg 360deg);
      -webkit-mask-composite: source-in;
      mask: radial-gradient(circle at center, transparent 0 31%, #000 31.5% 100%), conic-gradient(from -28deg, #000 0 56deg, transparent 56deg 360deg);
      mask-composite: intersect;
      transform: translate(-50%, -50%) rotate(var(--angle));
      transition: color .24s ease, background .24s ease, filter .24s ease;
      cursor: pointer;
      pointer-events: none;
      filter: drop-shadow(0 12px 18px rgba(0, 0, 0, .18));
    }

    .menu-item:hover,
    .menu-item.is-selected {
      color: #f8fcff;
      background: conic-gradient(from -28deg, rgba(25, 92, 103, .98) 0 56deg, transparent 56deg 360deg);
      filter: drop-shadow(0 0 9px rgba(92, 226, 225, .5)) drop-shadow(0 14px 22px rgba(0, 0, 0, .28));
    }

    .menu-item svg,
    .menu-item span {
      position: absolute;
      left: 50%;
      z-index: 1;
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(var(--content-rotation, 0deg));
    }

    .menu-item svg {
      top: 9%;
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-item span {
      top: 20%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(10px, 1.8vw, 12px);
      letter-spacing: .14em;
      text-align: center;
      white-space: nowrap;
    }
    .core-hit {
      position: absolute;
      inset: 26%;
      z-index: 4;
      border-radius: 50%;
    }

    .core {
      position: absolute;
      inset: 26%;
      z-index: 3;
      display: grid;
      place-items: center;
      border: 1px solid rgba(178, 204, 255, .42);
      border-radius: 50%;
      overflow: hidden;
      background: rgba(7, 13, 29, .92);
      box-shadow: 0 0 0 10px rgba(117, 177, 255, .035), 0 0 44px rgba(86, 162, 255, .18), inset 0 0 38px rgba(93, 141, 255, .12);
      cursor: crosshair;
    }

    .core::before,
    .core::after {
      content: "";
      position: absolute;
      inset: 9%;
      border-radius: 50%;
      border: 1px solid rgba(118, 245, 225, .28);
      pointer-events: none;
    }

    .core::after {
      inset: 16%;
      border-color: rgba(150, 136, 255, .22);
      border-style: dashed;
      transform: rotate(17deg) scaleX(.9);
    }

    .water-fill {
      position: absolute;
      z-index: 0;
      inset: 0;
      transform: scaleY(0);
      transform-origin: bottom center;
      background: linear-gradient(180deg, rgba(110, 236, 224, .88), rgba(62, 137, 255, .95) 48%, rgba(75, 70, 208, .98));
      transition: none;
      overflow: hidden;
    }

    .water-fill::before {
      content: "";
      position: absolute;
      top: -9px;
      left: -25%;
      width: 150%;
      height: 24px;
      background: radial-gradient(28px 12px at 22px 14px, rgba(183, 255, 247, .95) 0 55%, transparent 58%) repeat-x;
      background-size: 72px 24px;
      filter: blur(.2px);
      opacity: .85;
      animation: wave 3.5s linear infinite;
    }

    .water-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 14%, rgba(255, 255, 255, .14) 35%, transparent 43%, transparent 74%, rgba(255,255,255,.08) 82%, transparent 91%);
      mix-blend-mode: screen;
      animation: shimmer 2.8s ease-in-out infinite;
    }

    .core-content {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 8px;
      text-align: center;
      pointer-events: none;
      transition: transform .35s ease, filter .35s ease;
    }

    .is-hover .core-content { transform: translateY(-4px); }

    .logo-mark {
      width: clamp(42px, 8vw, 62px);
      height: clamp(42px, 8vw, 62px);
      filter: drop-shadow(0 0 12px rgba(121, 229, 227, .36));
    }

    .logo-mark circle,
    .logo-mark path {
      fill: none;
      stroke: #bceeff;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .logo-mark .accent { stroke: #75f1e1; }

    .core-title {
      font-size: clamp(15px, 2.4vw, 21px);
      font-weight: 650;
      letter-spacing: .26em;
      text-indent: .26em;
    }

    .core-subtitle {
      color: rgba(204, 222, 255, .6);
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .status-line {
      position: absolute;
      left: 50%;
      top: calc(50% + min(27vw, 215px));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(200, 218, 255, .58);
      font-size: 10px;
      letter-spacing: .14em;
      white-space: nowrap;
      transition: color .3s ease;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(138, 156, 194, .7);
      box-shadow: 0 0 0 4px rgba(138, 156, 194, .08);
      transition: background .3s ease, box-shadow .3s ease;
    }

    .is-hover .status-line { color: rgba(193, 255, 247, .8); }
    .is-hover .status-dot { background: var(--cyan); box-shadow: 0 0 0 4px rgba(117, 241, 225, .12), 0 0 16px rgba(117, 241, 225, .85); }

    @keyframes wave {
      to { transform: translateX(-72px); }
    }

    @keyframes shimmer {
      0%, 100% { transform: translateX(-18%); opacity: .32; }
      50% { transform: translateX(18%); opacity: .7; }
    }

    @media (max-width: 560px) {
      :root { --orbit-size: min(93vw, 620px); --ring-width: 88%; }
      .stage::after { bottom: -2rem; font-size: 8px; }
      .menu-item { border-radius: 18px; }
      .status-line { top: calc(50% + min(30vw, 190px)); font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="stage" id="liquidMenu" aria-label="交互式环形菜单">
    <div class="orbit-track" aria-hidden="true"></div>

    <div class="menu-shell" aria-label="展开菜单">
      <div class="orbit" id="orbit" style="--rotation: 0deg">
        <button class="menu-item is-selected" type="button" data-index="0" style="--angle: 0deg" aria-label="探索">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4M11 7v8M7 11h8"></path></svg>
          <span>探索</span>
        </button>
        <button class="menu-item" type="button" data-index="1" style="--angle: 60deg" aria-label="收藏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.2s-7-4.3-7-10.1A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.1c0 5.8-7 10.1-7 10.1Z"></path><path d="M9.5 12.3 11 14l3.7-4"></path></svg>
          <span>收藏</span>
        </button>
        <button class="menu-item" type="button" data-index="2" style="--angle: 120deg" aria-label="消息">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 16.5a3 3 0 0 1-3 3H9l-4 2v-5a3 3 0 0 1-1-2.3V8a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3Z"></path><path d="M8 10h8M8 13h5"></path></svg>
          <span>消息</span>
        </button>
        <button class="menu-item" type="button" data-index="3" style="--angle: 180deg" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H6.6v-2.4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L20 8.6l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2V14h-.2a1.7 1.7 0 0 0-1.8 1Z"></path></svg>
          <span>设置</span>
        </button>
        <button class="menu-item" type="button" data-index="4" style="--angle: 240deg" aria-label="帮助">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M9.8 9a2.4 2.4 0 1 1 3.9 1.9c-1.2.8-1.7 1.2-1.7 2.5M12 16.8h.01"></path></svg>
          <span>帮助</span>
        </button>
        <button class="menu-item" type="button" data-index="5" style="--angle: 300deg" aria-label="关于">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18.5V8.7L12 5l7 3.7v9.8L12 22Z"></path><path d="M5 8.7 12 13l7-4.3M12 13v9"></path></svg>
          <span>关于</span>
        </button>
      </div>
    </div>

    <div class="core-hit" aria-hidden="true"></div>
    <section class="core" id="core" role="application" aria-label="中心互动环">
      <div class="water-fill" id="waterFill" aria-hidden="true"></div>
      <div class="core-content">
        <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="23"></circle>
          <circle cx="32" cy="32" r="16" class="accent"></circle>
          <path d="M23 37c5.2-1.5 10.7-6.6 15-14 1.5 7.3-.1 13.4-5 17.1-3.6 2.8-7.2 2.7-10 .4Z" class="accent"></path>
          <path d="M24 39c3.5-3.3 6.4-7.6 9-12"></path>
        </svg>
        <div class="core-title">FLOW</div>
        <div class="core-subtitle">LIQUID ORBIT</div>
      </div>
    </section>

    <div class="status-line" aria-live="polite"><span class="status-dot"></span><span id="statusText">移入中心开始</span></div>
  </main>

  <script>
    (() => {
      const stage = document.querySelector('#liquidMenu');
      const core = document.querySelector('#core');
      const coreHit = document.querySelector('.core-hit');
      const orbit = document.querySelector('#orbit');
      const waterFill = document.querySelector('#waterFill');
      const statusText = document.querySelector('#statusText');
      const items = [...document.querySelectorAll('.menu-item')];
      const step = 360 / items.length;
      let fill = 0;
      let fillTarget = 0;
      let fillFrame = 0;
      let fillFrom = 0;
      let fillStartedAt = 0;
      let fillDuration = 1000;
      let menuTimer = 0;
      let expandTimer = 0;
      let rotation = 0;
      let active = false;
      let selected = 0;

      const mod = (value, length) => ((value % length) + length) % length;
      const setStatus = (text) => { statusText.textContent = text; };

      function renderFill(now) {
        const progress = Math.min(1, (now - fillStartedAt) / fillDuration);
        const eased = 1 - Math.pow(1 - progress, 3);
        fill = fillFrom + (fillTarget - fillFrom) * eased;
        waterFill.style.transform = `scaleY(${fill})`;
        if (progress < 1) {
          fillFrame = requestAnimationFrame(renderFill);
        } else {
          fill = fillTarget;
          waterFill.style.transform = `scaleY(${fill})`;
          fillFrame = 0;
          stage.classList.toggle('is-filled', fillTarget === 1 && active);
        }
      }

      function animateFill(target) {
        if (target === 0) stage.classList.remove('is-filled');
        fillFrom = fill;
        fillTarget = target;
        fillStartedAt = performance.now();
        fillDuration = target > fill ? 1000 : 850;
        if (!fillFrame) fillFrame = requestAnimationFrame(renderFill);
      }
      function setSelected(index) {
        selected = mod(index, items.length);
        items.forEach((item, index) => item.classList.toggle('is-selected', index === selected));
        setStatus(active ? `当前模块 · ${items[selected].getAttribute('aria-label')}` : '移入中心开始');
      }

      function updateContentOrientation() {
        items.forEach((item, index) => {
          const worldAngle = mod(index * step + rotation, 360);
          const tangentAngle = worldAngle > 90 && worldAngle < 270
            ? worldAngle - 180
            : worldAngle;
          item.style.setProperty('--content-rotation', `${tangentAngle}deg`);
        });
      }

      function applyRotation(nextRotation) {
        rotation = nextRotation;
        orbit.style.setProperty('--rotation', `${rotation}deg`);
        updateContentOrientation();
        setSelected(Math.round(-rotation / step));
      }

      updateContentOrientation();

      function activate() {
        if (active) return;
        active = true;
        stage.classList.remove('is-leaving');
        stage.classList.add('is-hover');
        if(new URLSearchParams(location.search).get('interaction')==='hover-preview')expandTimer=setTimeout(()=>{if(active)animateFill(1)},500);
        else animateFill(1);
        clearTimeout(menuTimer);
        menuTimer = window.setTimeout(() => {
          if (active) setStatus(`当前模块 · ${items[selected].getAttribute('aria-label')}`);
        }, 1000);
      }

      function deactivate() {
        if (!active) return;
        active = false;
        clearTimeout(expandTimer);
        clearTimeout(menuTimer);
        stage.classList.remove('is-hover');
        stage.classList.add('is-leaving');
        animateFill(0);
        setStatus('移入中心开始');
        window.setTimeout(() => stage.classList.remove('is-leaving'), 900);
      }

      coreHit.addEventListener('pointerenter', (event) => {
        const hoverPreview = new URLSearchParams(location.search).get('interaction') === 'hover-preview';
        if (hoverPreview) {
          if (document.documentElement.dataset.shiyuOrbitReady !== 'true' || !coreHit.matches(':hover')) return;
          activate();
          stage.dispatchEvent(new CustomEvent('orbit-hover-activated'));
          return;
        }
        activate();
      });
      core.addEventListener('pointermove', (event) => {
        if (new URLSearchParams(location.search).get('interaction') !== 'hover-preview') return;
        if (document.documentElement.dataset.shiyuOrbitReady !== 'true') return;
        if (active) return;
        if (event.target !== core || !core.matches(':hover')) return;
        activate();
        stage.dispatchEvent(new CustomEvent('orbit-hover-activated'));
      });
      stage.addEventListener('pointerleave', deactivate);

      stage.addEventListener('wheel', (event) => {
        if (!active) {
          // The iframe still occupies a rectangular host. Forward wheel input
          // from that inactive area so the parent page can keep scrolling.
          window.parent.postMessage({ type: 'shiyu-orbit-wheel', deltaY: event.deltaY, deltaMode: event.deltaMode }, '*');
          return;
        }
        event.preventDefault();
        const direction = event.deltaY > 0 ? -1 : 1;
        applyRotation(rotation + direction * step);
      }, { passive: false });

      function selectedIndexFromPointer(event) {
        const rect = orbit.getBoundingClientRect();
        const x = event.clientX - (rect.left + rect.width / 2);
        const y = event.clientY - (rect.top + rect.height / 2);
        let worldAngle = Math.atan2(x, -y) * 180 / Math.PI;
        if (worldAngle < 0) worldAngle += 360;
        const localAngle = mod(worldAngle - rotation, 360);
        return mod(Math.floor((localAngle + step / 2) / step), items.length);
      }

      orbit.addEventListener('click', (event) => {
        if (!active) return;
        const index = selectedIndexFromPointer(event);
        const item = items[index];
        applyRotation(-index * step);
        setStatus(`已选择 · ${item.getAttribute('aria-label')}`);
      });

      items.forEach((item, index) => {
        const selectItem = () => {
          if (!active) return;
          applyRotation(-index * step);
          setStatus(`已选择 · ${item.getAttribute('aria-label')}`);
        };
        item.addEventListener('click', (event) => {
          event.stopPropagation();
          selectItem();
        });
        item.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            selectItem();
          }
        });
      });

      window.addEventListener('blur', () => { if (active) deactivate(); });
    })();
  </script>
</body>
</html>
