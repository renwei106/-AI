<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收藏到拾隅</title><link rel="stylesheet" href="popup.css?v=20260929-static-font"><link rel="stylesheet" href="trial.css"></head>
<body class="side-panel">
  <main><select id="opening" hidden><option value="popup">浮框</option><option value="side">侧边栏</option></select>
    <div class="intro"><h1 id="view-title">收藏这点喜欢</h1><nav class="view-switch" aria-label="插件功能"><button type="button" data-view="bookmark" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg>收藏</button><button type="button" data-view="search" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>常用</button><button data-app="memo">▤ 小记 <small>入口预览</small></button><button data-app="todo">☑ 待办 <small>入口预览</small></button></nav></div>
    <form id="bookmark-form">
      <fieldset id="editor">
        <section class="current-page" aria-label="当前网页与收藏信息"><span class="site-symbol" id="site-symbol" aria-hidden="true"><img id="site-icon" alt="" hidden><span id="site-fallback">网</span></span><div class="page-fields"><div class="editable-line"><label class="sr-only" for="title">收藏名称</label><input id="title" maxlength="100" required autocomplete="off" placeholder="给这个收藏起个名字"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 16 11-11 4 4L8 20H4zM13 7l4 4"/></svg></div><span id="page-domain">正在读取当前网页…</span><div class="editable-note"><label class="sr-only" for="description">收藏备注</label><textarea id="description" maxlength="300" rows="2" placeholder="写一句备注（选填）"></textarea><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 16 11-11 4 4L8 20H4zM13 7l4 4"/></svg></div></div></section>
        <div id="destination"><p class="destination-heading">收藏至</p><div class="select-field"><span class="field-label">空间</span><div class="select-shell"><select id="space" aria-hidden="true" tabindex="-1"></select><button type="button" class="place-trigger" data-picker="space" aria-label="选择空间" aria-haspopup="listbox" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M4 14h7a3 3 0 0 0 3-3V4"/></svg><span data-picker-value>请选择</span><i></i></button><div class="place-menu" data-picker-menu="space" role="listbox" hidden></div></div></div><div class="select-row"><div class="select-field"><span class="field-label">场景</span><div class="select-shell"><select id="scene" aria-hidden="true" tabindex="-1"></select><button type="button" class="place-trigger" data-picker="scene" aria-label="选择场景" aria-haspopup="listbox" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg><span data-picker-value>请选择</span><i></i></button><div class="place-menu" data-picker-menu="scene" role="listbox" hidden></div></div></div><div class="select-field"><span class="field-label">分组</span><div class="select-shell"><select id="group" aria-hidden="true" tabindex="-1"></select><button type="button" class="place-trigger" data-picker="group" aria-label="选择分组" aria-haspopup="listbox" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 7V5h7l2 3h9v11H3z"/></svg><span data-picker-value>请选择</span><i></i></button><div class="place-menu" data-picker-menu="group" role="listbox" hidden></div></div></div></div></div>
        <p id="status" role="status" aria-live="polite"></p><button class="retry" id="retry" type="button" hidden>重新连接</button>
        <div class="save-actions"><button id="save-temporary" class="save-choice save-later" type="submit" data-submit-mode="temporary"><span class="space-inbox-drawer" aria-hidden="true"><i></i><i></i><b></b></span><span class="save-label">稍后整理</span></button><button id="save-group" class="save-choice save-selected" type="submit" data-submit-mode="group"><span class="category-stack-icon" aria-hidden="true"><i></i><b></b></span><span class="save-label">收藏至所选分组</span></button></div>
      </fieldset>
    </form>
    <section id="search-panel" hidden aria-labelledby="view-title"><label class="search-box" for="library-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="library-search" type="search" autocomplete="off" maxlength="100" placeholder="搜索名称、网址或备注"><kbd>Ctrl K</kbd></label><div class="filters" hidden><label>空间<select id="filter-space"></select></label><label>场景<select id="filter-scene"></select></label><label>分组<select id="filter-group"></select></label></div><button id="clear-filters" hidden>清除筛选</button><h2 class="common-heading">常用网址</h2><p class="search-summary" id="search-summary">输入关键词，查询全部收藏</p><div id="search-results" class="search-results" aria-live="polite"></div></section>
    <section id="trial-placeholder" hidden><h2></h2><p>入口预览 · 随时记录，也能回来查看。</p><p>本次先确认布局，记录与查看功能暂未接入。</p><button id="back-library">回到网址库</button></section><dialog id="move-dialog"><h2>归入分组</h2><label>空间<select id="move-space"></select></label><label>场景<select id="move-scene"></select></label><label>分组<select id="move-group"></select></label><p id="move-status" role="status"></p><div><button id="move-cancel">取消</button><button id="move-confirm" class="primary">确认归组</button></div></dialog><div id="login-panel" hidden>
      <div class="guest-brand"><svg class="guest-logo" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5.6" fill="var(--accent)"/><g fill="none" stroke="var(--on-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 14h7a4 4 0 0 0 4-4V3M14 14l7 7"/></g></svg><span>拾隅</span><small>让喜欢，自有归处</small></div>
      <h2>把偶然遇见的喜欢，留在自己的角落。</h2>
      <p>一键收藏眼前的好网页，让此刻的心动，成为日后重逢的风景。</p>
      <button class="primary" id="login">登录拾隅 <span>↗</span></button>
      <p class="guest-features">也可以翻翻常用、写写小记，记下待办。</p>
    </div>
    <p id="trial-note" hidden></p><nav class="bottom-groups" aria-label="常用分组"></nav><footer class="popup-footer"><div class="mode-icons"><button data-opening="popup" aria-label="浮框模式" title="浮框模式"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 9h16"/></svg></button><button data-opening="side" aria-label="侧边栏模式" title="侧边栏模式"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M10 5v14"/></svg></button></div><a class="popup-brand" href="https://shiyubox.com/" target="_blank" rel="noopener" aria-label="打开拾隅主页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 14h7a4 4 0 0 0 4-4V3M14 14l7 7"/></svg><small>拾隅</small></a><button type="button" id="version-status" class="version-status" aria-label="当前插件版本">V0.2.1</button></footer>
  </main>
  <script type="module" src="popup.js?v=20260929-static-font"></script>
<script type="module" src="trial.js"></script><script type="module" src="trial-apps.js"></script></body></html>
