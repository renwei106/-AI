map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name shiyubox.com www.shiyubox.com space.shiyubox.com world.shiyubox.com tool.shiyubox.com admin.shiyubox.com space-admin.shiyubox.com time-admin.shiyubox.com;
    client_max_body_size 9m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /bce26ee7fc706cafd3d382f4f93265a7.txt {
        root /var/www/shiyu-verification;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shiyubox.com space.shiyubox.com world.shiyubox.com;
    ssl_certificate /etc/letsencrypt/live/shiyubox-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shiyubox-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 9m;

    location = /bce26ee7fc706cafd3d382f4f93265a7.txt {
        root /var/www/shiyu-verification;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:4318;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4318;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

