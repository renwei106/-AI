<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收藏到拾隅</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <div class="intro"><h1>收藏这点喜欢</h1><span class="popup-brand" aria-label="拾隅"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 14h7a4 4 0 0 0 4-4V3M14 14l7 7"/></svg><small>拾隅</small></span></div>
    <form id="bookmark-form">
      <fieldset id="editor" disabled>
        <section class="current-page" aria-label="当前网页与收藏信息"><span class="site-symbol" id="site-symbol" aria-hidden="true"><img id="site-icon" alt="" hidden><span id="site-fallback">网</span></span><div class="page-fields"><div class="editable-line"><label class="sr-only" for="title">收藏名称</label><input id="title" maxlength="100" required autocomplete="off" placeholder="给这个收藏起个名字"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 16 11-11 4 4L8 20H4zM13 7l4 4"/></svg></div><span id="page-domain">正在读取当前网页…</span><div class="editable-note"><label class="sr-only" for="description">收藏备注</label><textarea id="description" maxlength="300" rows="2" placeholder="写一句备注（选填）"></textarea><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 16 11-11 4 4L8 20H4zM13 7l4 4"/></svg></div></div></section>
        <div class="mode-switch" role="group" aria-label="收藏方式"><button type="button" data-mode="temporary" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 4-2 11v5h20v-5L20 4Z"/><path d="M2 15h6l2 3h4l2-3h6"/></svg>稍后整理</button><button type="button" data-mode="group" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>分类收藏</button></div>
        <div id="temporary-panel" class="temporary-panel"><div class="drawer-illustration" aria-hidden="true"><span class="loose-card card-one"></span><span class="loose-card card-two"></span><span class="loose-card card-three"></span><span class="loose-dot dot-one"></span><span class="loose-dot dot-two"></span><span class="drawer-front"><i></i></span></div><p>暂时放进这个小抽屉。<br><small>回到空间页，在「稍后整理」里找到它。</small></p></div>
        <div id="destination" hidden><div class="select-field"><span class="field-label">空间</span><div class="select-shell"><select id="space" aria-hidden="true" tabindex="-1"></select><button type="button" class="place-trigger" data-picker="space" aria-label="选择空间" aria-haspopup="listbox" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M4 14h7a3 3 0 0 0 3-3V4"/></svg><span data-picker-value>请选择</span><i></i></button><div class="place-menu" data-picker-menu="space" role="listbox" hidden></div></div></div><div class="select-row"><div class="select-field"><span class="field-label">场景</span><div class="select-shell"><select id="scene" aria-hidden="true" tabindex="-1"></select><button type="button" class="place-trigger" data-picker="scene" aria-label="选择场景" aria-haspopup="listbox" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg><span data-picker-value>请选择</span><i></i></button><div class="place-menu" data-picker-menu="scene" role="listbox" hidden></div></div></div><div class="select-field"><span class="field-label">分组</span><div class="select-shell"><select id="group" aria-hidden="true" tabindex="-1"></select><button type="button" class="place-trigger" data-picker="group" aria-label="选择分组" aria-haspopup="listbox" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 7V5h7l2 3h9v11H3z"/></svg><span data-picker-value>请选择</span><i></i></button><div class="place-menu" data-picker-menu="group" role="listbox" hidden></div></div></div></div></div>
        <p id="status" role="status" aria-live="polite"></p><button class="retry" id="retry" type="button" hidden>重新连接</button>
        <button id="save" class="primary" type="submit">保存到稍后整理 <span>↗</span></button>
      </fieldset>
    </form>
    <div id="login-panel" hidden><p>登录后，把喜欢的网页放进自己的收藏。</p><button class="primary" id="login">登录拾隅 <span>↗</span></button></div>
  </main>
  <script type="module" src="popup.js"></script>
</body></html>
