<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收藏到拾隅</title><link rel="stylesheet" href="popup.css?v=20260924-inverse-actions"></head>
<body>
  <main>
    <div class="intro"><h1>收藏这点喜欢</h1><span class="popup-brand" aria-label="拾隅"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 14h7a4 4 0 0 0 4-4V3M14 14l7 7"/></svg><small>拾隅</small></span></div>
    <form id="bookmark-form">
      <fieldset id="editor" disabled>
        <section class="current-page" aria-label="当前网页与收藏信息"><span class="site-symbol" id="site-symbol" aria-hidden="true"><img id="site-icon" alt="" hidden><span id="site-fallback">网</span></span><div class="page-fields"><div class="editable-line"><label class="sr-only" for="title">收藏名称</label><input id="title" maxlength="100" required autocomplete="off" placeholder="给这个收藏起个名字"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 16 11-11 4 4L8 20H4zM13 7l4 4"/></svg></div><span id="page-domain">正在读取当前网页…</span><div class="editable-note"><label class="sr-only" for="description">收藏备注</label><textarea id="description" maxlength="300" rows="2" placeholder="写一句备注（选填）"></textarea><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 16 11-11 4 4L8 20H4zM13 7l4 4"/></svg></div></div></section>
        <div id="destination"><p class="destination-heading">收藏至</p><div class="select-field"><span class="field-label">空间</span><div class="select-shell"><select id="space" aria-hidden="true" tabindex="-1"></select><button type="button" class="place-trigger" data-picker="space" aria-label="选择空间" aria-haspopup="listbox" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M4 14h7a3 3 0 0 0 3-3V4"/></svg><span data-picker-value>请选择</span><i></i></button><div class="place-menu" data-picker-menu="space" role="listbox" hidden></div></div></div><div class="select-row"><div class="select-field"><span class="field-label">场景</span><div class="select-shell"><select id="scene" aria-hidden="true" tabindex="-1"></select><button type="button" class="place-trigger" data-picker="scene" aria-label="选择场景" aria-haspopup="listbox" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg><span data-picker-value>请选择</span><i></i></button><div class="place-menu" data-picker-menu="scene" role="listbox" hidden></div></div></div><div class="select-field"><span class="field-label">分组</span><div class="select-shell"><select id="group" aria-hidden="true" tabindex="-1"></select><button type="button" class="place-trigger" data-picker="group" aria-label="选择分组" aria-haspopup="listbox" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 7V5h7l2 3h9v11H3z"/></svg><span data-picker-value>请选择</span><i></i></button><div class="place-menu" data-picker-menu="group" role="listbox" hidden></div></div></div></div></div>
        <p id="status" role="status" aria-live="polite"></p><button class="retry" id="retry" type="button" hidden>重新连接</button>
        <div class="save-actions"><button id="save-temporary" class="save-choice save-later" type="submit" data-submit-mode="temporary"><span class="space-inbox-drawer" aria-hidden="true"><i></i><i></i><b></b></span><span class="save-label">稍后整理</span></button><button id="save-group" class="save-choice save-selected" type="submit" data-submit-mode="group"><span class="category-stack-icon" aria-hidden="true"><i></i><b></b></span><span class="save-label">收藏至所选分组</span></button></div>
      </fieldset>
    </form>
    <div id="login-panel" hidden>
      <div class="guest-illustration" aria-hidden="true"><svg viewBox="0 0 280 108" fill="none"><path d="M25 78c34-45 67 10 104-29 30-31 57-28 91-1 17 14 28 18 39 17"/><rect x="39" y="19" width="75" height="55" rx="12"/><path d="M52 36h46M52 48h31M52 60h39"/><rect x="143" y="30" width="91" height="61" rx="14"/><path d="M160 48h56M160 61h42M160 74h49"/><circle cx="126" cy="23" r="4"/><circle cx="247" cy="35" r="3"/></svg></div>
      <h2>把散落的喜欢，收进拾隅。</h2>
      <p>遇到想留下的网页，可以先放进「稍后整理」，也可以直接归入你的空间、场景和分组。</p>
      <button class="primary" id="login">登录拾隅 <span>↗</span></button>
    </div>
  </main>
  <script type="module" src="popup.js?v=20260924-shiyu-preview"></script>
</body></html>
